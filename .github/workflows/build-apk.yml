name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore v5.13 web application
        run: |
          base64 --decode .github/v5.13-index.html.gz.b64 | gzip -dc > app/src/main/assets/index.html
          test -s app/src/main/assets/index.html

      - name: Build unsigned release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Zipalign APK
        run: |
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BUILD_TOOLS/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk TurnikCoach-unsigned-aligned.apk
          "$BUILD_TOOLS/zipalign" -c -p 4 TurnikCoach-unsigned-aligned.apk

      - name: Upload unsigned aligned APK
        uses: actions/upload-artifact@v4
        with:
          name: TurnikCoach-Unsigned-APK
          path: TurnikCoach-unsigned-aligned.apk
          if-no-files-found: error
