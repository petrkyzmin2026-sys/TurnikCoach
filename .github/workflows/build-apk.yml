name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore stable debug signing key
        run: |
          mkdir -p "$HOME/.android"
          base64 --decode .github/stable-debug.keystore.b64 > "$HOME/.android/debug.keystore"

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk TurnikCoach.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TurnikCoach-APK
          path: TurnikCoach.apk
          if-no-files-found: error
