name: Build Football Totals APK

on:
  push:
    branches: [ football-totals-app ]
    paths:
      - 'football-totals/android/**'
      - '.github/workflows/build-football-totals-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK
        working-directory: football-totals/android
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Football-Totals-APK
          path: football-totals/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
