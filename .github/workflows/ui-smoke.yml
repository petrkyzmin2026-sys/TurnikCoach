name: Android UI Smoke Test

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'scripts/ui_smoke.py'
      - '.github/workflows/ui-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: turnikcoach-ui-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Enable KVM
        run: |
          sudo chmod 666 /dev/kvm || true

      - name: Run real UI scenario on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell pm clear ru.turnikcoach.app
            python3 scripts/ui_smoke.py

      - name: Upload test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TurnikCoach-UI-Test-Screenshots
          path: ui-test-output
          if-no-files-found: warn
