name: Course calendar regression and Android test APK

on:
  push:
    branches:
      - feature/course-calendar-start-date-20260925
      - feature/discard-workout-undo-today-20260925
      - fix/undo-button-layout-20260925
      - fix/webview-confirm-undo-20260925
      - fix/forced-hotupdate-handover-20260925
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks-and-test-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check actual live code and bundled module
        run: node scripts/course_calendar_test.js
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore packaged base application
        run: |
          BASE_COMMIT="2d156b1c192e68f102a63d79cd3fa179fc412f5f"
          : > /tmp/v513.b64
          for n in 01 02 03 04 05; do
            curl -fsSL "https://raw.githubusercontent.com/petrkyzmin2026-sys/TurnikCoach/${BASE_COMMIT}/.github/v5.13-index.part${n}.b64" >> /tmp/v513.b64
          done
          base64 --decode /tmp/v513.b64 | gzip -dc > app/src/main/assets/index.html
          grep -q 'v5.13 — modern Android package' app/src/main/assets/index.html
      - name: Embed previous 5.16.20 hotfix to reproduce the installed user state
        run: |
          curl -fsSL "https://raw.githubusercontent.com/petrkyzmin2026-sys/TurnikCoach/af642bdfd042e033e0c66ddc5c6dfb09effde782/live/hotfix.js" > app/src/main/assets/hotfix.js
          grep -q 'TURNIKCOACH_HOTFIX 5.16.20-undo-ui-fix' app/src/main/assets/hotfix.js
          grep -q 'TURNIKCOACH_HOTFIX 5.16.22-forced-handover' live/hotfix.js
      - name: Seed the exact old approved version and saved course record in test HTML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/assets/index.html')
          html=p.read_text()
          marker='</head>'
          assert html.count(marker)==1
          seed=r'''<script>
          (function(){
            if(localStorage.getItem('__tcForcedHandoverSmokeSeeded')) return;
            var d=new Date(),k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
            localStorage.setItem('tc_hotfix_approved_version','5.16.20-undo-ui-fix');
            localStorage.setItem('tc_morozov_course_v1',JSON.stringify({
              enabled:true,level:4,goal:'quantity',pullMax:20,courseSeq:1,extraSeq:0,
              lastCourseDate:k,lastCourseTs:Date.now(),weeklySessions:3,cycleStartDate:k,
              testAnchorDate:k,lastTestDate:'',testDeferredUntil:'',
              history:[{type:'workout',date:k,ts:Date.now(),feedback:'test',total:0,details:[],
                courseMode:'course',courseLevel:4,courseComplex:3,courseGoal:'quantity'}],
              tests:[],masteryTests:[],exerciseMax:{}
            }));
            localStorage.setItem('__tcForcedHandoverSmokeSeeded','1');
          })();
          </script>'''
          p.write_text(html.replace(marker,seed+marker))
          PY
      - name: Isolate test application and point native updater to immutable 5.16.22
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/build.gradle')
          gradle=p.read_text()
          assert gradle.count('android {')==1
          gradle=gradle.replace('android {', """android {
              buildTypes {
                  debug {
                      applicationIdSuffix '.calendarpreview'
                      versionNameSuffix '-calendarpreview'
                  }
              }""",1)
          p.write_text(gradle)

          activity=Path('app/src/main/java/ru/turnikcoach/app/MainActivity.java')
          java=activity.read_text()
          old='https://raw.githubusercontent.com/petrkyzmin2026-sys/TurnikCoach/main/live/hotfix.js'
          new='https://raw.githubusercontent.com/petrkyzmin2026-sys/TurnikCoach/7b4c5ac3aebc0c6f80c8a78cd939dbea452a216f/live/hotfix.js'
          assert java.count(old)==1
          java=java.replace(old,new)
          java=java.replace('        startHotfixUpdate();','        new android.os.Handler(getMainLooper()).postDelayed(this::startHotfixUpdate, 1500);')
          activity.write_text(java)

          manifest=Path('app/src/main/AndroidManifest.xml')
          text=manifest.read_text().replace('android:label="Турник Тренер"', 'android:label="Турник Тренер · ТЕСТ"')
          manifest.write_text(text)
          PY
      - name: Build isolated DEBUG preview APK
        run: |
          gradle --no-daemon :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk TurnikCoach-ForcedHandover-Preview-v5.16.22.apk
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm || true
      - name: Verify forced remote update from installed 5.16.20 and undo in real Android WebView
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb install -r TurnikCoach-ForcedHandover-Preview-v5.16.22.apk
            TC_TEST_PKG=ru.turnikcoach.v52tr.calendarpreview python3 scripts/course_undo_ui_smoke.py
      - name: Upload undo UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TurnikCoach-5.16.22-forced-handover-smoke-screenshots
          path: undo-ui-test-output
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: TurnikCoach-5.16.22-forced-handover-isolated-preview
          path: TurnikCoach-ForcedHandover-Preview-v5.16.22.apk
          if-no-files-found: error
