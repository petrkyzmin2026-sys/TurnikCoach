name: Course calendar regression and Android test APK

on:
  push:
    branches:
      - feature/course-calendar-start-date-20260925
      - feature/discard-workout-undo-today-20260925
      - fix/undo-button-layout-20260925
      - fix/webview-confirm-undo-20260925
      - fix/forced-hotupdate-handover-20260925
      - fix/ux-block3-critical-path-20260926
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks-and-test-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check actual live code and bundled module
        run: node scripts/course_calendar_test.js
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore packaged base application
        run: |
          BASE_COMMIT="2d156b1c192e68f102a63d79cd3fa179fc412f5f"
          : > /tmp/v513.b64
          for n in 01 02 03 04 05; do
            curl -fsSL "https://raw.githubusercontent.com/petrkyzmin2026-sys/TurnikCoach/${BASE_COMMIT}/.github/v5.13-index.part${n}.b64" >> /tmp/v513.b64
          done
          base64 --decode /tmp/v513.b64 | gzip -dc > app/src/main/assets/index.html
          grep -q 'v5.13 — modern Android package' app/src/main/assets/index.html
      - name: Reproduce installed 5.16.22 and stage tested 5.16.23 locally
        run: |
          OLD_COMMIT="c5624cb6f7d36b5c3598a71c7e4010cb8b859b5a"
          curl -fsSL "https://raw.githubusercontent.com/petrkyzmin2026-sys/TurnikCoach/${OLD_COMMIT}/live/hotfix.js" > app/src/main/assets/hotfix.js
          cp live/hotfix.js app/src/main/assets/hotfix-next.js
          grep -q 'TURNIKCOACH_HOTFIX 5.16.22-forced-handover' app/src/main/assets/hotfix.js
          grep -q 'TURNIKCOACH_HOTFIX 5.16.23-critical-ux' app/src/main/assets/hotfix-next.js
          grep -q 'TURNIKCOACH_COURSE 1.0.21-critical-controls' app/src/main/assets/hotfix-next.js
      - name: Seed installed 5.16.22 approval and completed main-course state
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/assets/index.html')
          html=p.read_text()
          marker='</head>'
          assert html.count(marker)==1
          seed=r'''<script>
          (function(){
            if(localStorage.getItem('__tcForcedHandoverSmokeSeeded')) return;
            var d=new Date(),k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
            localStorage.setItem('tc_hotfix_approved_version','5.16.22-forced-handover');
            localStorage.setItem('tc_morozov_course_v1',JSON.stringify({
              enabled:true,level:4,goal:'quantity',pullMax:20,courseSeq:1,extraSeq:0,
              lastCourseDate:k,lastCourseTs:Date.now(),weeklySessions:3,cycleStartDate:k,
              testAnchorDate:k,lastTestDate:'',testDeferredUntil:'',
              history:[{type:'workout',date:k,ts:Date.now(),feedback:'test',total:0,details:[],
                courseMode:'course',courseLevel:4,courseComplex:3,courseGoal:'quantity'}],
              tests:[],masteryTests:[],exerciseMax:{}
            }));
            localStorage.setItem('__tcForcedHandoverSmokeSeeded','1');
          })();
          </script>'''
          p.write_text(html.replace(marker,seed+marker))
          PY
      - name: Isolate test application from installed production data
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/build.gradle')
          gradle=p.read_text()
          assert gradle.count('android {')==1
          gradle=gradle.replace('android {', """android {
              buildTypes {
                  debug {
                      applicationIdSuffix '.calendarpreview'
                      versionNameSuffix '-calendarpreview'
                  }
              }""",1)
          p.write_text(gradle)

          activity=Path('app/src/main/java/ru/turnikcoach/app/MainActivity.java')
          java=activity.read_text()
          java=java.replace('        startHotfixUpdate();','        // deterministic test: staged hotfix is applied from assets')
          onfinish='''                applyAssetHotfix();
                applyCachedHotfix();'''
          assert java.count(onfinish)==1
          java=java.replace(onfinish,onfinish+'''
                web.postDelayed(() -> applyTestNextHotfix(), 1200);''')
          marker='''    private void applyAssetHotfix() {'''
          assert java.count(marker)==1
          helper=(
              "    private void applyTestNextHotfix() {\n"
              "        try (InputStream in = getAssets().open(\"hotfix-next.js\"); ByteArrayOutputStream out = new ByteArrayOutputStream()) {\n"
              "            byte[] buf = new byte[8192];\n"
              "            int n;\n"
              "            while ((n = in.read(buf)) > 0) out.write(buf, 0, n);\n"
              "            String js = out.toString(StandardCharsets.UTF_8.name());\n"
              "            if (validHotfix(js)) applyScript(js);\n"
              "        } catch (Exception ignored) {\n"
              "        }\n"
              "    }\n\n"
          )
          java=java.replace(marker,helper+marker)
          activity.write_text(java)

          manifest=Path('app/src/main/AndroidManifest.xml')
          text=manifest.read_text().replace('android:label="Турник Тренер"', 'android:label="Турник Тренер · ТЕСТ"')
          manifest.write_text(text)
          PY
      - name: Build isolated DEBUG preview APK
        run: |
          gradle --no-daemon :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk TurnikCoach-UXBlock3-Preview-v5.16.23.apk
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm || true
      - name: Verify update, after-main extra and visible discard in real Android WebView
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb install -r TurnikCoach-UXBlock3-Preview-v5.16.23.apk
            TC_TEST_PKG=ru.turnikcoach.v52tr.calendarpreview python3 scripts/course_undo_ui_smoke.py
      - name: Upload UX block 3 screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TurnikCoach-5.16.23-ux-block3-smoke-screenshots
          path: undo-ui-test-output
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: TurnikCoach-5.16.23-ux-block3-isolated-preview
          path: TurnikCoach-UXBlock3-Preview-v5.16.23.apk
          if-no-files-found: error
