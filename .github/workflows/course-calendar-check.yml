name: Course calendar regression and Android test APK

on:
  push:
    branches:
      - feature/course-calendar-start-date-20260925
      - feature/discard-workout-undo-today-20260925
      - fix/undo-button-layout-20260925
      - fix/webview-confirm-undo-20260925
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks-and-test-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check actual live code and bundled module
        run: node scripts/course_calendar_test.js
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore packaged base application
        run: |
          BASE_COMMIT="2d156b1c192e68f102a63d79cd3fa179fc412f5f"
          : > /tmp/v513.b64
          for n in 01 02 03 04 05; do
            curl -fsSL "https://raw.githubusercontent.com/petrkyzmin2026-sys/TurnikCoach/${BASE_COMMIT}/.github/v5.13-index.part${n}.b64" >> /tmp/v513.b64
          done
          base64 --decode /tmp/v513.b64 | gzip -dc > app/src/main/assets/index.html
          grep -q 'v5.13 — modern Android package' app/src/main/assets/index.html
      - name: Embed tested opt-in hotfix in test application
        run: |
          cp live/hotfix.js app/src/main/assets/hotfix.js
          grep -q 'TURNIKCOACH_HOTFIX 5.16.21-webview-confirm' app/src/main/assets/hotfix.js
      - name: Isolate test application from installed production data
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/build.gradle')
          s=p.read_text()
          assert s.count('android {') == 1
          s=s.replace('android {', """android {
              buildTypes {
                  debug {
                      applicationIdSuffix '.calendarpreview'
                      versionNameSuffix '-calendarpreview'
                  }
              }""",1)
          p.write_text(s)
          activity=Path('app/src/main/java/ru/turnikcoach/app/MainActivity.java')
          java=activity.read_text()
          old='https://raw.githubusercontent.com/petrkyzmin2026-sys/TurnikCoach/main/live/hotfix.js'
          assert java.count(old)==1
          java=java.replace(old,'https://127.0.0.1/turnikcoach-preview-no-remote-updates.js')
          onfinish="                applyAssetHotfix();\n                applyCachedHotfix();"
          assert java.count(onfinish)==1
          seed='''                applyAssetHotfix();
                applyCachedHotfix();
                web.evaluateJavascript(
                    "(function(){try{"+
                    "if(localStorage.getItem('__tcUndoUiSmokeSeeded'))return;"+
                    "var d=(typeof dateKey==='function'?dateKey():new Date().toISOString().slice(0,10));"+
                    "localStorage.setItem('tc_hotfix_approved_version','5.16.21-webview-confirm');"+
                    "localStorage.setItem('tc_morozov_course_v1',JSON.stringify({enabled:true,level:4,goal:'quantity',pullMax:20,courseSeq:1,extraSeq:0,lastCourseDate:d,lastCourseTs:Date.now(),weeklySessions:3,cycleStartDate:d,testAnchorDate:d,lastTestDate:'',testDeferredUntil:'',history:[{type:'workout',date:d,ts:Date.now(),feedback:'test',total:0,details:[],courseMode:'course',courseLevel:4,courseComplex:3,courseGoal:'quantity'}],tests:[],masteryTests:[],exerciseMax:{}}));"+
                    "localStorage.setItem('__tcUndoUiSmokeSeeded','1');location.reload();"+
                    "}catch(e){console.error(e)}})();",
                    null
                );'''
          java=java.replace(onfinish,seed)
          activity.write_text(java)
          manifest=Path('app/src/main/AndroidManifest.xml')
          s=manifest.read_text().replace('android:label="Турник Тренер"', 'android:label="Турник Тренер · ТЕСТ"')
          manifest.write_text(s)
          PY
      - name: Build isolated DEBUG preview APK
        run: |
          gradle --no-daemon :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk TurnikCoach-WebViewConfirm-Preview-v5.16.21.apk
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm || true
      - name: Verify undo button in a real Android WebView
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb install -r TurnikCoach-WebViewConfirm-Preview-v5.16.21.apk
            TC_TEST_PKG=ru.turnikcoach.app.calendarpreview python3 scripts/course_undo_ui_smoke.py
      - name: Upload undo UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TurnikCoach-5.16.21-undo-ui-smoke-screenshots
          path: undo-ui-test-output
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: TurnikCoach-5.16.21-webview-confirm-isolated-preview
          path: TurnikCoach-WebViewConfirm-Preview-v5.16.21.apk
          if-no-files-found: error
