      - feature/course-calendar-start-date-20260925
      - feature/discard-workout-undo-today-20260925
      - fix/undo-button-layout-20260925
      - fix/webview-confirm-undo-20260925
      - fix/forced-hotupdate-handover-20260925
      - fix/ux-block3-critical-path-20260926
      - fix/ux-block4-action-feedback-20260926
      - fix/ux-block4b-forms-feedback-20260926
      - fix/ux-block5a-touch-targets-20260926
      - fix/ux-block5b-exercise-touch-audit-20260926
      - fix/ux-block5c-form-controls-20260926
      - feature/ux2-foundation-20260926
      - feature/ux2-progressive-settings-20260926
      - feature/ux2-workout-flow-20260926
      - feature/ux2-completion-flow-20260926
      - feature/ux2-accessibility-scale-20260929
      - fix/workout-exit-visibility-20261001
      - fix/extra-start-touch-release-20261002
      - feature/ux2-haptics-rebased-20261002
      - feature/ux2-correction-controls-20261002
      - feature/ux2-progress-on-correction-20261002
      - fix/workout-two-buttons-20261003
      - fix/workout-top-back-exit-20261004
      - fix/exit-finish-without-save-20261004
      - feature/flexible-course-schedule-20261005
      - feature/morozov-course-stats-20261005
      - refactor/core-foundation-5.16.44
      - refactor/domain-state-5.16.45
      - refactor/ui-presenter-5.16.46
      - refactor/unified-workout-store-5.16.47
      - refactor/unified-workout-writes-5.16.48
      - refactor/transactional-completion-undo-5.16.49
      - refactor/transactional-course-controls-5.16.50
      - refactor/ui-render-owner-5.16.51
      - refactor/workout-action-owner-5.16.52
      - refactor/workout-lifecycle-owner-5.16.53
      - refactor/navigation-owner-5.16.54
      - refactor/workout-ui-owner-5.16.55
      - refactor/course-persistence-owner-5.16.56
      - refactor/course-domain-owner-5.16.57
      - refactor/course-viewstate-owner-5.16.58
      - refactor/standard-workout-action-owner-5.16.59
      - refactor/rest-state-owner-5.16.60
      - refactor/active-workout-owner-5.16.61
      - refactor/correction-owner-5.16.62
      - refactor/info-owner-5.16.63
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks-and-test-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Check actual live code and bundled module
        run: node scripts/course_calendar_test.js
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore packaged base application
        run: |
          BASE_COMMIT="2d156b1c192e68f102a63d79cd3fa179fc412f5f"
          : > /tmp/v513.b64
          for n in 01 02 03 04 05; do
            curl -fsSL "https://raw.githubusercontent.com/petrkyzmin2026-sys/TurnikCoach/${BASE_COMMIT}/.github/v5.13-index.part${n}.b64" >> /tmp/v513.b64
          done
          base64 --decode /tmp/v513.b64 | gzip -dc > app/src/main/assets/index.html
          grep -q 'v5.13 — modern Android package' app/src/main/assets/index.html
      - name: Reproduce packaged 5.14 + cached 5.16.62 + tested 5.16.63
        run: |
          PREV_COMMIT="7ec8c2bcfe0534b6d40ee2a897a559b80a21ce6b"
          grep -q 'TURNIKCOACH_HOTFIX 5.14.0-adaptive-rest' app/src/main/assets/hotfix.js
          curl -fsSL "https://raw.githubusercontent.com/petrkyzmin2026-sys/TurnikCoach/${PREV_COMMIT}/live/hotfix.js" > app/src/main/assets/hotfix-prev.js
          curl -fsSL "https://raw.githubusercontent.com/petrkyzmin2026-sys/TurnikCoach/${PREV_COMMIT}/live/course.js" > app/src/main/assets/course-prev.js
          curl -fsSL "https://raw.githubusercontent.com/petrkyzmin2026-sys/TurnikCoach/${PREV_COMMIT}/live/course_domain.js" > app/src/main/assets/course-domain-prev.js
          curl -fsSL "https://raw.githubusercontent.com/petrkyzmin2026-sys/TurnikCoach/${PREV_COMMIT}/live/store.js" > app/src/main/assets/store-prev.js
          cp live/hotfix.js app/src/main/assets/hotfix-next.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/assets/hotfix-next.js')
          s=p.read_text()
          needle="function tcAudio(){\ntry{"
          assert needle in s
          s=s.replace(needle,"function tcAudio(){\nif(window.__TC_DISABLE_AUDIO_FOR_SMOKE)return null;\ntry{",1)
          p.write_text(s)
          PY
          grep -q 'TURNIKCOACH_HOTFIX 5.16.62-correction-owner' app/src/main/assets/hotfix-prev.js
          grep -q 'TURNIKCOACH_HOTFIX 5.16.63-info-owner' app/src/main/assets/hotfix-next.js
          grep -q 'TURNIKCOACH_CORE 1.0.0' app/src/main/assets/hotfix-next.js
          grep -q 'TURNIKCOACH_DOMAIN 1.0.0' live/domain.js
          grep -q 'TURNIKCOACH_UI 1.0.0' live/ui.js
          grep -q 'TURNIKCOACH_WORKOUT_STORE 1.2.0-undo-restore' live/store.js
          grep -q 'TURNIKCOACH_WORKOUT_STORE 1.2.0-undo-restore' app/src/main/assets/store-prev.js
          grep -q 'TURNIKCOACH_WORKOUT_ACTIONS 1.0.0' live/actions.js
          grep -q 'TURNIKCOACH_STANDARD_WORKOUT 1.0.0-action-owner' live/standard_workout.js
          grep -q 'TURNIKCOACH_REST 1.0.0-state-owner' live/rest.js
          grep -q 'TURNIKCOACH_ACTIVE_WORKOUT 1.0.0-persistence-owner' live/active_workout.js
          grep -q 'TURNIKCOACH_CORRECTION 1.0.0-owner' live/correction.js
          grep -q 'TURNIKCOACH_INFO 1.0.0-owner' live/info.js
          grep -q 'TURNIKCOACH_WORKOUT_LIFECYCLE 1.0.0' live/lifecycle.js
          grep -q 'TURNIKCOACH_NAVIGATION 1.0.0' live/navigation.js
          grep -q 'TURNIKCOACH_WORKOUT_UI 1.0.0' live/workout_ui.js
          grep -q 'TURNIKCOACH_COURSE_DOMAIN 1.1.0-viewstate-owner' live/course_domain.js
          grep -q 'TURNIKCOACH_COURSE 1.0.47-viewstate-adapter' live/course.js
          grep -q 'TURNIKCOACH_COURSE 1.0.47-viewstate-adapter' app/src/main/assets/course-prev.js
          grep -q 'TURNIKCOACH_COURSE 1.0.48-info-provider' live/course.js
          grep -q 'TURNIKCOACH_COURSE_DOMAIN 1.1.0-viewstate-owner' app/src/main/assets/course-domain-prev.js
          ! grep -q 'COURSE_MODULE_BUNDLED=' app/src/main/assets/hotfix-next.js
      - name: Seed installed 5.16.62 approval and info/correction/active-workout/rest/course caches with completed main-course state
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('app/src/main/assets/index.html')
          html=p.read_text()
          prev_course_cache=json.dumps(Path('app/src/main/assets/course-prev.js').read_text())
          domain_cache=json.dumps(Path('live/domain.js').read_text())
          ui_cache=json.dumps(Path('live/ui.js').read_text())
          prev_store_cache=json.dumps(Path('app/src/main/assets/store-prev.js').read_text())
          next_store_cache=json.dumps(Path('live/store.js').read_text())
          actions_cache=json.dumps(Path('live/actions.js').read_text())
          standard_workout_cache=json.dumps(Path('live/standard_workout.js').read_text())
          rest_cache=json.dumps(Path('live/rest.js').read_text())
          active_workout_cache=json.dumps(Path('live/active_workout.js').read_text())
          correction_cache=json.dumps(Path('live/correction.js').read_text())
          info_cache=json.dumps(Path('live/info.js').read_text())
          lifecycle_cache=json.dumps(Path('live/lifecycle.js').read_text())
          navigation_cache=json.dumps(Path('live/navigation.js').read_text())
          workout_ui_cache=json.dumps(Path('live/workout_ui.js').read_text())
          prev_course_domain_cache=json.dumps(Path('app/src/main/assets/course-domain-prev.js').read_text())
          next_course_domain_cache=json.dumps(Path('live/course_domain.js').read_text())
          next_course_cache=json.dumps(Path('live/course.js').read_text())
          marker='</head>'
          assert html.count(marker)==1
          seed=r'''<script>
          (function(){
            window.__TC_DISABLE_AUDIO_FOR_SMOKE=true;
            localStorage.setItem('tc_module_domain_1.0.0',__DOMAIN_CACHE__);
            localStorage.setItem('tc_module_ui_1.0.0',__UI_CACHE__);
            localStorage.setItem('tc_module_store_1.2.0-undo-restore',__PREV_STORE_CACHE__);
            localStorage.setItem('tc_module_store_1.2.0-undo-restore',__NEXT_STORE_CACHE__);
            localStorage.setItem('tc_module_actions_1.0.0',__ACTIONS_CACHE__);
            localStorage.setItem('tc_module_standard_workout_1.0.0-action-owner',__STANDARD_WORKOUT_CACHE__);
            localStorage.setItem('tc_module_rest_1.0.0-state-owner',__REST_CACHE__);
            localStorage.setItem('tc_module_active_workout_1.0.0-persistence-owner',__ACTIVE_WORKOUT_CACHE__);
            localStorage.setItem('tc_module_correction_1.0.0-owner',__CORRECTION_CACHE__);
            localStorage.setItem('tc_module_info_1.0.0-owner',__INFO_CACHE__);
            localStorage.setItem('tc_module_lifecycle_1.0.0',__LIFECYCLE_CACHE__);
            localStorage.setItem('tc_module_navigation_1.0.0',__NAVIGATION_CACHE__);
            localStorage.setItem('tc_module_workout_ui_1.0.0',__WORKOUT_UI_CACHE__);
            localStorage.setItem('tc_module_course_domain_1.1.0-viewstate-owner',__PREV_COURSE_DOMAIN_CACHE__);
            localStorage.setItem('tc_module_course_domain_1.1.0-viewstate-owner',__NEXT_COURSE_DOMAIN_CACHE__);
            localStorage.setItem('tc_module_course_1.0.47-viewstate-adapter',__PREV_COURSE_CACHE__);
            localStorage.setItem('tc_module_course_1.0.48-info-provider',__NEXT_COURSE_CACHE__);
            if(localStorage.getItem('__tcForcedHandoverSmokeSeeded')) return;
            var d=new Date(),k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
            localStorage.setItem('tc_hotfix_approved_version','5.16.62-correction-owner');
            localStorage.setItem('tc_morozov_course_v1',JSON.stringify({
              enabled:true,level:4,goal:'quantity',pullMax:20,courseSeq:1,extraSeq:0,
              lastCourseDate:k,lastCourseTs:Date.now(),weeklySessions:3,cycleStartDate:k,
              testAnchorDate:k,lastTestDate:'',testDeferredUntil:'',
              history:[{type:'workout',date:k,ts:Date.now(),feedback:'test',total:0,details:[],
                courseMode:'course',courseLevel:4,courseComplex:3,courseGoal:'quantity'}],
              tests:[],masteryTests:[],exerciseMax:{}
            }));
            localStorage.setItem('__tcForcedHandoverSmokeSeeded','1');
            window.addEventListener('error',function(e){console.error('TC_DIAG window-error',e.message,e.filename,e.lineno,e.colno);});
            document.addEventListener('pointerup',function(e){
              var b=e.target&&e.target.closest&&e.target.closest('#tcStartExtraAfterCourseBtn');
              if(b)console.log('TC_DIAG pointerup extra',b.id);
            },true);
            document.addEventListener('touchend',function(e){
              var b=e.target&&e.target.closest&&e.target.closest('#tcStartExtraAfterCourseBtn');
              if(b)console.log('TC_DIAG touchend extra',b.id);
            },true);
            document.addEventListener('click',function(e){
              var b=e.target&&e.target.closest&&e.target.closest('#tcStartExtraAfterCourseBtn');
              if(b)console.log('TC_DIAG click extra',b.id);
            },true);

            function tcTestLog(payload){console.log('TC_TEST_UI',JSON.stringify(payload));}
            function tcInstallTestDriver(){
              if(document.getElementById('tcTestDriver'))return;
              var host=document.createElement('div');
              host.id='tcTestDriver';
              host.style.cssText='position:fixed;left:4px;top:4px;z-index:2147483647;display:grid;gap:3px;width:122px;pointer-events:auto';
              host.innerHTML=
                '<button id="tcTestComplete" type="button" style="min-height:48px">TC COMPLETE</button>'+
                '<button id="tcTestUndo" type="button" style="min-height:48px">TC UNDO</button>'+
                '<button id="tcTestStart" type="button" style="min-height:48px">TC START</button>'+
                '<button id="tcTestDiscard" type="button" style="min-height:48px">TC DISCARD</button>';
              document.body.appendChild(host);

              document.getElementById('tcTestComplete').onclick=function(){
                try{
                  if(!W||!Array.isArray(W.items)){tcTestLog({phase:'complete',ok:false,reason:'no-workout'});return;}
                  W.items.forEach(function(x){x.actual=Array.isArray(x.plan)?x.plan.slice():[];});
                  W.exerciseIndex=Math.max(0,W.items.length-1);
                  W.setIndex=Math.max(0,(W.items[W.exerciseIndex].plan||[]).length-1);
                  W.actual=(W.items[W.exerciseIndex].plan||[])[W.setIndex]||0;
                  window.finishWorkout('Нормально');
                  setTimeout(function(){
                    var box=document.getElementById('sheetbox');
                    tcTestLog({phase:'complete',ok:true,hasW:!!W,sheetOpen:!!document.querySelector('#sheet.open'),undo:!!document.getElementById('tcCompletionUndoBtn'),text:box?box.innerText:''});
                  },80);
                }catch(e){tcTestLog({phase:'complete',ok:false,error:String(e&&e.message||e)});}
              };
              document.getElementById('tcTestUndo').onclick=function(){
                try{
                  var ok=window.tcUndoLastCompletion();
                  setTimeout(function(){
                    tcTestLog({phase:'undo',ok:!!ok,hasW:!!W,sheetOpen:!!document.querySelector('#sheet.open'),screen:(document.querySelector('.screen.on')||{}).id||'',extraAvailable:document.body.innerText.includes('Начать дополнительную тренировку')});
                  },80);
                }catch(e){tcTestLog({phase:'undo',ok:false,error:String(e&&e.message||e)});}
              };
              document.getElementById('tcTestStart').onclick=function(){
                try{
                  var ok=window.tcStartExtraWorkout();
                  setTimeout(function(){tcTestLog({phase:'start-again',ok:ok!==false,hasW:!!W,screen:(document.querySelector('.screen.on')||{}).id||'',mode:W&&W.mode||''});},80);
                }catch(e){tcTestLog({phase:'start-again',ok:false,error:String(e&&e.message||e)});}
              };
              document.getElementById('tcTestDiscard').onclick=function(){
                try{
                  window.tcDiscardWorkout();
                  setTimeout(function(){
                    var yes=document.getElementById('tcConfirmDiscardWorkoutBtn');if(yes)yes.click();
                    setTimeout(function(){tcTestLog({phase:'discard',hasW:!!W,screen:(document.querySelector('.screen.on')||{}).id||'',sheetOpen:!!document.querySelector('#sheet.open'),snapshot:localStorage.getItem('tc_active_workout_v2')});},100);
                  },30);
                }catch(e){tcTestLog({phase:'discard',error:String(e&&e.message||e)});}
              };
            }
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',tcInstallTestDriver,{once:true});
            else tcInstallTestDriver();
          })();
          </script>'''
          seed=seed.replace('__PREV_COURSE_CACHE__',prev_course_cache).replace('__DOMAIN_CACHE__',domain_cache).replace('__UI_CACHE__',ui_cache).replace('__PREV_STORE_CACHE__',prev_store_cache).replace('__NEXT_STORE_CACHE__',next_store_cache).replace('__ACTIONS_CACHE__',actions_cache).replace('__STANDARD_WORKOUT_CACHE__',standard_workout_cache).replace('__REST_CACHE__',rest_cache).replace('__ACTIVE_WORKOUT_CACHE__',active_workout_cache).replace('__CORRECTION_CACHE__',correction_cache).replace('__INFO_CACHE__',info_cache).replace('__LIFECYCLE_CACHE__',lifecycle_cache).replace('__NAVIGATION_CACHE__',navigation_cache).replace('__WORKOUT_UI_CACHE__',workout_ui_cache).replace('__PREV_COURSE_DOMAIN_CACHE__',prev_course_domain_cache).replace('__NEXT_COURSE_DOMAIN_CACHE__',next_course_domain_cache).replace('__NEXT_COURSE_CACHE__',next_course_cache)
          p.write_text(html.replace(marker,seed+marker))
          PY
      - name: Isolate test application from installed production data
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/build.gradle')
          gradle=p.read_text()
          assert gradle.count('android {')==1
          gradle=gradle.replace('android {', """android {
              buildTypes {
                  debug {
                      applicationIdSuffix '.calendarpreview'
                      versionNameSuffix '-calendarpreview'
                  }
              }""",1)
          p.write_text(gradle)

          activity=Path('app/src/main/java/ru/turnikcoach/app/MainActivity.java')
          java=activity.read_text()
          java=java.replace('import android.util.Base64;','import android.util.Base64;\nimport android.util.Log;\nimport android.content.BroadcastReceiver;\nimport android.content.Context;\nimport android.content.Intent;\nimport android.content.IntentFilter;')
          java=java.replace('import android.webkit.WebSettings;','import android.webkit.WebSettings;\nimport android.webkit.ConsoleMessage;\nimport android.webkit.WebChromeClient;')
          chrome_marker='        s.setCacheMode(WebSettings.LOAD_DEFAULT);'
          assert java.count(chrome_marker)==1
          chrome_code=(
              "        s.setCacheMode(WebSettings.LOAD_DEFAULT);\n"
              "        WebView.setWebContentsDebuggingEnabled(true);\n"
              "        web.setWebChromeClient(new WebChromeClient() {\n"
              "            @Override public boolean onConsoleMessage(ConsoleMessage message) {\n"
              "                Log.d(\"TurnikCoachJS\", message.message() + \" @ \" + message.sourceId() + \":\" + message.lineNumber());\n"
              "                return true;\n"
              "            }\n"
              "        });"
          )
          java=java.replace(chrome_marker,chrome_code)
          receiver_marker='        web.loadUrl("file:///android_asset/index.html");'
          assert java.count(receiver_marker)==1
          receiver_code=(
              "        BroadcastReceiver tcTestJsReceiver = new BroadcastReceiver() {\n"
              "            @Override public void onReceive(Context context, Intent intent) {\n"
              "                try {\n"
              "                    Log.d(\"TurnikCoachBridge\", \"receiver-enter action=\" + (intent == null ? \"null\" : intent.getAction()));\n"
              "                    String encoded = intent.getStringExtra(\"js_b64\");\n"
              "                    if (encoded == null) { Log.d(\"TurnikCoachBridge\", \"missing-js\"); return; }\n"
              "                    String js = new String(Base64.decode(encoded, Base64.DEFAULT), StandardCharsets.UTF_8);\n"
              "                    Log.d(\"TurnikCoachBridge\", \"eval-start len=\" + js.length());\n"
              "                    web.post(() -> {\n"
              "                        Log.d(\"TurnikCoachBridge\", \"eval-post-run\");\n"
              "                        web.evaluateJavascript(js, value -> {\n"
              "                            String result = value == null ? \"null\" : value;\n"
              "                            Log.d(\"TurnikCoachJSResult\", result);\n"
              "                            try (FileOutputStream out = new FileOutputStream(new File(getFilesDir(), \"tc-test-js-result.txt\"), false)) {\n"
              "                                out.write(result.getBytes(StandardCharsets.UTF_8));\n"
              "                            } catch (Exception ignored) {}\n"
              "                        });\n"
              "                        Log.d(\"TurnikCoachBridge\", \"eval-js-dispatched\");\n"
              "                    });\n"
              "                } catch (Exception e) {\n"
              "                    Log.e(\"TurnikCoachJSResult\", \"bridge-error\", e);\n"
              "                }\n"
              "            }\n"
              "        };\n"
              "        registerReceiver(tcTestJsReceiver, new IntentFilter(\"ru.turnikcoach.TEST_EVAL\"), Context.RECEIVER_EXPORTED);\n"
              "        web.loadUrl(\"file:///android_asset/index.html\");"
          )
          java=java.replace(receiver_marker,receiver_code)
          java=java.replace('        startHotfixUpdate();','        // deterministic test: staged hotfix is applied from assets')
          asset_line='                applyAssetHotfix();'
          assert java.count(asset_line)==1
          java=java.replace(asset_line,asset_line+'\n                applyTestAssetHotfix("hotfix-prev.js");')
          cached_line='                applyCachedHotfix();'
          assert java.count(cached_line)==1
          java=java.replace(cached_line,cached_line+'\n                web.postDelayed(() -> applyTestAssetHotfix("hotfix-next.js"), 1200);')
          marker='''    private void applyAssetHotfix() {'''
          assert java.count(marker)==1
          helper=(
              "    private void applyTestAssetHotfix(String name) {\n"
              "        try (InputStream in = getAssets().open(name); ByteArrayOutputStream out = new ByteArrayOutputStream()) {\n"
              "            byte[] buf = new byte[8192];\n"
              "            int n;\n"
              "            while ((n = in.read(buf)) > 0) out.write(buf, 0, n);\n"
              "            String js = out.toString(StandardCharsets.UTF_8.name());\n"
              "            if (validHotfix(js)) applyScript(js);\n"
              "        } catch (Exception ignored) {\n"
              "        }\n"
              "    }\n\n"
          )
          java=java.replace(marker,helper+marker)
          intent_marker='''    @Override public void onBackPressed() {'''
          assert java.count(intent_marker)==1
          intent_bridge=(
              "    @Override protected void onNewIntent(Intent intent) {\n"
              "        super.onNewIntent(intent);\n"
              "        if (intent == null || !\"ru.turnikcoach.TEST_EVAL\".equals(intent.getAction())) return;\n"
              "        try {\n"
              "            String encoded = intent.getStringExtra(\"js_b64\");\n"
              "            if (encoded == null) return;\n"
              "            String js = new String(Base64.decode(encoded, Base64.DEFAULT), StandardCharsets.UTF_8);\n"
              "            web.evaluateJavascript(js, value -> {\n"
              "                String result = value == null ? \"null\" : value;\n"
              "                Log.d(\"TurnikCoachJSResult\", result);\n"
              "                try (FileOutputStream out = new FileOutputStream(new File(getFilesDir(), \"tc-test-js-result.txt\"), false)) {\n"
              "                    out.write(result.getBytes(StandardCharsets.UTF_8));\n"
              "                } catch (Exception ignored) {}\n"
              "            });\n"
              "        } catch (Exception e) {\n"
              "            Log.e(\"TurnikCoachJSResult\", \"intent-bridge-error\", e);\n"
              "        }\n"
              "    }\n\n"
          )
          java=java.replace(intent_marker,intent_bridge+intent_marker)
          activity.write_text(java)

          manifest=Path('app/src/main/AndroidManifest.xml')
          text=manifest.read_text().replace('android:label="Турник Тренер"', 'android:label="Турник Тренер · ТЕСТ"')
          text=text.replace('<activity android:name=".MainActivity"', '<activity android:name=".MainActivity" android:launchMode="singleTop"')
          manifest.write_text(text)
          PY
      - name: Build isolated DEBUG preview APK
        run: |
          gradle --no-daemon :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk TurnikCoach-Info-Owner-Preview-v5.16.63.apk
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm || true
      - name: Verify 5.16.63 Info Owner accessibility baseline in real Android WebView
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader -noaudio -no-boot-anim
          script: |
            adb install -r TurnikCoach-Info-Owner-Preview-v5.16.63.apk
            TC_TEST_PKG=ru.turnikcoach.v52tr.calendarpreview python3 scripts/course_undo_ui_smoke.py
      - name: Upload UX2 accessibility baseline screenshots
        if: always()
