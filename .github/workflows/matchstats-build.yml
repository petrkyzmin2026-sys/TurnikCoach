name: Build MatchStats APK

on:
  push:
    branches: [ matchstats-prototype ]
    paths:
      - 'matchstats/**'
      - '.github/workflows/matchstats-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: matchstats
        run: gradle :app:assembleDebug --no-daemon
      - name: Prepare DENZL APK
        run: cp matchstats/app/build/outputs/apk/debug/app-debug.apk DENZL-v1.0-probability-only.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DENZL-v1.0-probability-only
          path: DENZL-v1.0-probability-only.apk
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete denzl-v1.0-probability-only --yes || true
          git push origin :refs/tags/denzl-v1.0-probability-only || true
          gh release create denzl-v1.0-probability-only DENZL-v1.0-probability-only.apk --target "$GITHUB_SHA" --title "DENZL v1.0" --notes "Probability-only build. Removed API-Football, API keys, bookmaker odds and market comparison. Fixed SofaScore routing: LINE uses api.sofascore.com scheduled-events only; LIVE uses sofascore.com live board with api.sofascore.com fallback. Manual LIVE refresh retained."
