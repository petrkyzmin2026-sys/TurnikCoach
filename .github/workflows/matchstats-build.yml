name: Build MatchStats APK

on:
  push:
    branches: [ matchstats-prototype ]
    paths:
      - 'matchstats/**'
      - '.github/workflows/matchstats-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: matchstats-prototype
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Integrate lineup lookup
        run: |
          python3 - <<'PY'
          p='matchstats/app/src/main/java/ru/matchstats/app/MainActivity.java'
          s=open(p,encoding='utf-8').read()

          old='m.ph=getProfile(m.rawHome);m.pa=getProfile(m.rawAway);if(m.live)loadLiveStats(m);loadOdds(m);calculate(m);'
          new='m.ph=getProfile(m.rawHome);m.pa=getProfile(m.rawAway);loadLineups(m);if(m.live)loadLiveStats(m);loadOdds(m);calculate(m);'
          if old in s:s=s.replace(old,new)

          old_live='try{loadLiveStats(m);loadOdds(m);calculate(m);selectedLive.put(m.id,m);}'
          new_live='try{loadLineups(m);loadLiveStats(m);loadOdds(m);calculate(m);selectedLive.put(m.id,m);}'
          if old_live in s:s=s.replace(old_live,new_live)

          marker='    private void loadLiveStats(Match m)'
          if 'private void loadLineups(Match m)' not in s:
              lineup='''    private void loadLineups(Match m){
              m.lineupFound=false;m.lineupConfirmed=false;m.homeLineupAttack=1.0;m.homeLineupDefence=1.0;m.awayLineupAttack=1.0;m.awayLineupDefence=1.0;
              if(m.id==null||m.id.isEmpty()||"0".equals(m.id))return;
              try{JSONObject r=getJson(SOFA+"/event/"+m.id+"/lineups","https://www.sofascore.com/");JSONObject h=r.optJSONObject("home"),a=r.optJSONObject("away");if(h==null||a==null)return;JSONArray hp=h.optJSONArray("players"),ap=a.optJSONArray("players");if(hp==null||ap==null)return;int hs=countStarters(hp),as=countStarters(ap);if(hs<8||as<8)return;m.lineupFound=true;m.lineupConfirmed=r.optBoolean("confirmed",false);double[] hv=lineupFactors(hp),av=lineupFactors(ap);m.homeLineupAttack=hv[0];m.homeLineupDefence=hv[1];m.awayLineupAttack=av[0];m.awayLineupDefence=av[1];}catch(Exception ignored){}
              }
              private int countStarters(JSONArray a){int n=0;for(int i=0;i<a.length();i++){JSONObject e=a.optJSONObject(i);if(e!=null&&!e.optBoolean("substitute",false))n++;}return n;}
              private double[] lineupFactors(JSONArray a){double att=0,def=0;int an=0,dn=0;for(int i=0;i<a.length();i++){JSONObject e=a.optJSONObject(i);if(e==null||e.optBoolean("substitute",false))continue;JSONObject p=e.optJSONObject("player");String pos=p==null?"":p.optString("position","");double rating=num(e.opt("avgRating"));if(rating<=0)rating=num(e.opt("rating"));if(rating<=0)continue;double f=clamp(1.0+(rating-6.8)*0.055,.92,1.08);if("F".equals(pos)||"M".equals(pos)){att+=f;an++;}if("G".equals(pos)||"D".equals(pos)||"M".equals(pos)){def+=f;dn++;}}return new double[]{an>0?att/an:1.0,dn>0?def/dn:1.0};}

'''
              s=s.replace(marker,lineup+marker)

          old_fields='double p1Odd,xOdd,p2Odd,o15Odd,u15Odd,o25Odd,u25Odd,o35Odd,u35Odd,bttsYesOdd,bttsNoOdd,bttsO25Odd,hP1Odd,hXOdd,hP2Odd,hO05Odd,hU05Odd,hO10Odd,hU10Odd,hO15Odd,hU15Odd,liveXgH,liveXgA,liveSotH,liveSotA,liveShotsH,liveShotsA,lambdaH,lambdaA;'
          new_fields='double p1Odd,xOdd,p2Odd,o15Odd,u15Odd,o25Odd,u25Odd,o35Odd,u35Odd,bttsYesOdd,bttsNoOdd,bttsO25Odd,hP1Odd,hXOdd,hP2Odd,hO05Odd,hU05Odd,hO10Odd,hU10Odd,hO15Odd,hU15Odd,liveXgH,liveXgA,liveSotH,liveSotA,liveShotsH,liveShotsA,lambdaH,lambdaA,homeLineupAttack=1.0,homeLineupDefence=1.0,awayLineupAttack=1.0,awayLineupDefence=1.0;boolean lineupFound=false,lineupConfirmed=false;'
          if old_fields in s:s=s.replace(old_fields,new_fields)

          needle='x.homeForm=h.form();x.awayForm=a.form();'
          repl=needle+'x.homeLineupAttack=m.homeLineupAttack;x.homeLineupDefence=m.homeLineupDefence;x.awayLineupAttack=m.awayLineupAttack;x.awayLineupDefence=m.awayLineupDefence;x.homeLineupConfirmed=m.lineupConfirmed;x.awayLineupConfirmed=m.lineupConfirmed;'
          if needle in s and 'x.homeLineupAttack=m.homeLineupAttack' not in s:s=s.replace(needle,repl)

          crit='m.criteria.add(new Criterion("Расчётное ядро",true,3,m.lambdaH,m.lambdaA,String.format(Locale.US,"lambda %.2f / %.2f",m.lambdaH,m.lambdaA)));'
          add=crit+'if(m.lineupFound)m.criteria.add(new Criterion(m.lineupConfirmed?"Состав подтверждён":"Предполагаемый состав",true,m.lineupConfirmed?2:1,m.homeLineupAttack,m.awayLineupAttack,m.lineupConfirmed?"официальный":"предполагаемый"));'
          if crit in s and '"Предполагаемый состав"' not in s:s=s.replace(crit,add)

          open(p,'w',encoding='utf-8').write(s)
          PY

      - name: Verify lineup integration
        run: |
          grep -q 'loadLineups(m);if(m.live)loadLiveStats(m)' matchstats/app/src/main/java/ru/matchstats/app/MainActivity.java
          grep -q 'event/.*lineups' matchstats/app/src/main/java/ru/matchstats/app/MainActivity.java
          grep -q 'x.homeLineupAttack=m.homeLineupAttack' matchstats/app/src/main/java/ru/matchstats/app/MainActivity.java
          grep -q 'ProbabilityEngine.calculate(x)' matchstats/app/src/main/java/ru/matchstats/app/MainActivity.java
          ! grep -q 'tw+=crit' matchstats/app/src/main/java/ru/matchstats/app/MainActivity.java

      - name: Persist source integration
        run: |
          if ! git diff --quiet -- matchstats/app/src/main/java/ru/matchstats/app/MainActivity.java; then
            git config user.name github-actions
            git config user.email github-actions@github.com
            git add matchstats/app/src/main/java/ru/matchstats/app/MainActivity.java
            git commit -m 'DENZL v1.5: integrate predicted and confirmed lineups'
            git push origin HEAD:matchstats-prototype
          fi

      - name: Build debug APK
        working-directory: matchstats
        run: gradle :app:assembleDebug --no-daemon

      - name: Prepare development APK
        run: cp matchstats/app/build/outputs/apk/debug/app-debug.apk DENZL-v1.5-dev.apk

      - name: Upload development APK
        uses: actions/upload-artifact@v4
        with:
          name: DENZL-v1.5-dev
          path: DENZL-v1.5-dev.apk
