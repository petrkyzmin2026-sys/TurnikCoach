name: Build DENZL APK

on:
  push:
    branches: [ denzl-live-goals-patch ]
    paths:
      - 'matchstats/**'
      - '.github/workflows/matchstats-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Apply DENZL v1.3 source patch
        working-directory: matchstats
        run: python3 patch_v13.py
      - name: Build debug APK
        working-directory: matchstats
        run: gradle :app:assembleDebug --no-daemon
      - name: Prepare DENZL APK
        run: cp matchstats/app/build/outputs/apk/debug/app-debug.apk DENZL-v1.3-live.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DENZL-v1.3-live
          path: DENZL-v1.3-live.apk
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete denzl-v1.3-live --yes || true
          git push origin :refs/tags/denzl-v1.3-live || true
          gh release create denzl-v1.3-live DENZL-v1.3-live.apk --target "$GITHUB_SHA" --title "DENZL v1.3" --notes "LIVE refresh: 2 minutes. DENZL probabilities recalculate from match minute, score and available live statistics. Odds source: BETCITY primary, Fonbet automatic fallback. The UI shows the bookmaker source actually in use; odds are not synthesized by DENZL."
