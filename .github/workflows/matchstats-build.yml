name: Build MatchStats APK

on:
  push:
    branches: [ matchstats-prototype ]
    paths:
      - 'matchstats/**'
      - '.github/workflows/matchstats-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: matchstats
        run: gradle :app:assembleDebug --no-daemon
      - name: Prepare DENZL APK
        run: cp matchstats/app/build/outputs/apk/debug/app-debug.apk DENZL-v1.1-espn-ru-nav.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DENZL-v1.1-espn-ru-nav
          path: DENZL-v1.1-espn-ru-nav.apk
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete denzl-v1.1-espn-ru-nav --yes || true
          git push origin :refs/tags/denzl-v1.1-espn-ru-nav || true
          gh release create denzl-v1.1-espn-ru-nav DENZL-v1.1-espn-ru-nav.apk --target "$GITHUB_SHA" --title "DENZL v1.1" --notes "Switched event source from SofaScore to ESPN public scoreboard. Added Country -> League -> Matches navigation, Russian country/league/team display, probability-only model, and automatic LIVE refresh every 30 seconds. No API keys and no bookmaker odds."
