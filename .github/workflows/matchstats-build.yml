name: Build MatchStats APK

on:
  push:
    branches: [ matchstats-prototype ]
    paths:
      - 'matchstats/**'
      - '.github/workflows/matchstats-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Fix source typo
        run: |
          sed -i 's/return100;/return 100;/g; s/return80;/return 80;/g' matchstats/app/src/main/java/ru/matchstats/app/MainActivity.java
      - name: Build debug APK
        working-directory: matchstats
        run: gradle :app:assembleDebug --no-daemon
      - name: Prepare DENZL APK
        run: cp matchstats/app/build/outputs/apk/debug/app-debug.apk DENZL-v1.2-betcity.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DENZL-v1.2-betcity
          path: DENZL-v1.2-betcity.apk
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete denzl-v1.2-betcity --yes || true
          git push origin :refs/tags/denzl-v1.2-betcity || true
          gh release create denzl-v1.2-betcity DENZL-v1.2-betcity.apk --target "$GITHUB_SHA" --title "DENZL v1.2" --notes "BETCITY line/live and odds. Search-only football 11x11. SofaScore primary and FotMob fallback for historical statistics. DENZL calculates probabilities independently and LIVE refreshes every 30 seconds."
