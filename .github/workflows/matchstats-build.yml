name: Build MatchStats APK

'on':
  push:
    branches:
      - matchstats-prototype
    paths:
      - 'matchstats/**'
      - '.github/workflows/matchstats-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: matchstats-prototype
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify lineup integration
        run: |
          grep -q 'loadLineups(m);if(m.live)loadLiveStats(m)' matchstats/app/src/main/java/ru/matchstats/app/MainActivity.java
          grep -q '/lineups' matchstats/app/src/main/java/ru/matchstats/app/MainActivity.java
          grep -q 'x.homeLineupAttack=m.homeLineupAttack' matchstats/app/src/main/java/ru/matchstats/app/MainActivity.java
          grep -q 'ProbabilityEngine.calculate(x)' matchstats/app/src/main/java/ru/matchstats/app/MainActivity.java
          ! grep -q 'tw+=crit' matchstats/app/src/main/java/ru/matchstats/app/MainActivity.java
      - name: Build debug APK
        working-directory: matchstats
        run: gradle :app:assembleDebug --no-daemon
      - name: Prepare development APK
        run: cp matchstats/app/build/outputs/apk/debug/app-debug.apk DENZL-v1.5-dev.apk
      - name: Upload development APK
        uses: actions/upload-artifact@v4
        with:
          name: DENZL-v1.5-dev
          path: DENZL-v1.5-dev.apk
